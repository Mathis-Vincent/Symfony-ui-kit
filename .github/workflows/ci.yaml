name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    php:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4']
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: intl, zip
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Lint PHP files
              run: find src dev-app/src -name '*.php' -print0 | xargs -0 -n1 php -l

            - name: Lint Twig templates
              run: php dev-app/bin/console lint:twig templates dev-app/templates

            - name: Lint container and YAML config
              run: |
                  php dev-app/bin/console lint:yaml dev-app/config
                  php dev-app/bin/console lint:container

    assets:
        name: Front assets
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install and build the playground assets
              working-directory: dev-app
              run: |
                  npm install
                  npm run build

    dist:
        name: Distributed archive
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Guards the promise made in the README: none of the development scaffolding
            # ends up in what Composer downloads.
            - name: Ensure dev-only files are excluded from the dist archive
              run: |
                  git archive HEAD --format=tar | tar -t > /tmp/dist.txt
                  status=0
                  for path in dev-app/ docker/ compose.yaml Makefile .github/ .dockerignore; do
                      if grep -q "^${path}" /tmp/dist.txt; then
                          echo "::error::${path} leaks into the distributed archive"
                          status=1
                      fi
                  done
                  for path in src/ templates/ translations/ assets/ public/ docs/ composer.json LICENSE; do
                      if ! grep -q "^${path}" /tmp/dist.txt; then
                          echo "::error::${path} is missing from the distributed archive"
                          status=1
                      fi
                  done
                  exit $status
