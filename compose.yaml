# Development stack of the bundle: PHP to serve the playground, Node to compile its assets.
# Not part of the distributed package (`export-ignore`), so `composer require` never sees it.

services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        volumes:
            - .:/app
            - composer-cache:/home/dev/.composer
        ports:
            - "${PLAYGROUND_PORT:-8123}:8000"
        environment:
            APP_ENV: dev
            APP_DEBUG: '1'

    node:
        image: node:22-alpine
        working_dir: /app/dev-app
        volumes:
            - .:/app
        command: sh -c "npm install && npm run watch"

volumes:
    composer-cache:
