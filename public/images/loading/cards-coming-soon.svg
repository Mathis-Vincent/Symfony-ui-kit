<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" fill="none">
    <title>Cards coming soon</title>
    <style>
        /* Animations play when the SVG is referenced from an &lt;img&gt; tag */
        .st-skel {
            fill-opacity: .10;
            animation: st-skel-pulse 2.2s ease-in-out infinite;
        }
        .st-card--1 .st-skel { animation-delay: 0s; }
        .st-card--2 .st-skel { animation-delay: .25s; }
        .st-card--3 .st-skel { animation-delay: .5s; }

        .st-scan {
            transform-box: view-box;
            transform-origin: center;
            opacity: 0;
            animation: st-scan-sweep 2.6s ease-in-out infinite;
        }

        .st-hand {
            transform-box: view-box;
            transform-origin: 120px 80px;
            animation: st-clock-spin linear infinite;
        }
        .st-hand--minute { animation-duration: 6s; }
        .st-hand--hour   { animation-duration: 18s; }

        @keyframes st-skel-pulse {
            0%   { fill-opacity: .10; }
            50%  { fill-opacity: .28; }
            100% { fill-opacity: .10; }
        }

        @keyframes st-scan-sweep {
            0%   { transform: translateX(0); opacity: 0; }
            15%  { opacity: 1; }
            85%  { opacity: 1; }
            100% { transform: translateX(158px); opacity: 0; }
        }

        @keyframes st-clock-spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .st-skel, .st-scan, .st-hand { animation: none; }
        }
    </style>

    <!-- Card frame -->
    <rect x="8" y="8" width="224" height="144" rx="14" fill="#FAF8F2" stroke="#1E40AF" stroke-width="2"/>

    <!-- Card 1 -->
    <g class="st-card--1">
        <rect x="26" y="30" width="56" height="100" rx="8" fill="#1E40AF" fill-opacity="0.06" stroke="#1E40AF" stroke-opacity="0.25" stroke-width="1.5"/>
        <rect class="st-skel" x="34" y="38" width="40" height="26" rx="5" fill="#1E40AF"/>
        <rect class="st-skel" x="34" y="72" width="40" height="7" rx="3.5" fill="#1E40AF"/>
        <rect class="st-skel" x="34" y="84" width="28" height="7" rx="3.5" fill="#1E40AF"/>
        <rect class="st-skel" x="34" y="112" width="24" height="10" rx="5" fill="#1E40AF"/>
    </g>

    <!-- Card 2 -->
    <g class="st-card--2">
        <rect x="92" y="30" width="56" height="100" rx="8" fill="#1E40AF" fill-opacity="0.06" stroke="#1E40AF" stroke-opacity="0.25" stroke-width="1.5"/>
        <rect class="st-skel" x="100" y="38" width="40" height="26" rx="5" fill="#1E40AF"/>
        <rect class="st-skel" x="100" y="72" width="40" height="7" rx="3.5" fill="#1E40AF"/>
        <rect class="st-skel" x="100" y="84" width="28" height="7" rx="3.5" fill="#1E40AF"/>
        <rect class="st-skel" x="100" y="112" width="24" height="10" rx="5" fill="#1E40AF"/>
    </g>

    <!-- Card 3 -->
    <g class="st-card--3">
        <rect x="158" y="30" width="56" height="100" rx="8" fill="#1E40AF" fill-opacity="0.06" stroke="#1E40AF" stroke-opacity="0.25" stroke-width="1.5"/>
        <rect class="st-skel" x="166" y="38" width="40" height="26" rx="5" fill="#1E40AF"/>
        <rect class="st-skel" x="166" y="72" width="40" height="7" rx="3.5" fill="#1E40AF"/>
        <rect class="st-skel" x="166" y="84" width="28" height="7" rx="3.5" fill="#1E40AF"/>
        <rect class="st-skel" x="166" y="112" width="24" height="10" rx="5" fill="#1E40AF"/>
    </g>

    <!-- Scanning line hinting at loading cards -->
    <line class="st-scan" x1="26" y1="28" x2="26" y2="132"
          stroke="#FBBF24" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round"/>

    <!-- "Coming soon" clock badge -->
    <circle cx="120" cy="80" r="22" fill="#FAF8F2" stroke="#1E3A8A" stroke-opacity="0.45" stroke-width="2.5"/>
    <line class="st-hand st-hand--minute" x1="120" y1="80" x2="120" y2="68" stroke="#1E40AF" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round"/>
    <line class="st-hand st-hand--hour" x1="120" y1="80" x2="129" y2="84" stroke="#1E40AF" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round"/>
</svg>
