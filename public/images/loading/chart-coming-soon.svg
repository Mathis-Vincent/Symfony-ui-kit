<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" fill="none">
    <title>Chart coming soon</title>
    <style>
        /* Animations play when the SVG is referenced from an &lt;img&gt; tag */
        .st-bar {
            transform-box: view-box;
            transform: scaleY(.35);
            animation: st-bar-grow 4s ease-in-out infinite;
        }
        .st-bar--1 { transform-origin: 68px 124px;  animation-delay: 0s; }
        .st-bar--2 { transform-origin: 100px 124px; animation-delay: .15s; }
        .st-bar--3 { transform-origin: 132px 124px; animation-delay: .3s; }
        .st-bar--4 { transform-origin: 164px 124px; animation-delay: .45s; }
        .st-bar--5 { transform-origin: 196px 124px; animation-delay: .6s; }

        .st-trend {
            animation: st-trend-march 1.6s linear infinite;
        }

        .st-hand {
            transform-box: view-box;
            transform-origin: 120px 80px;
            animation: st-clock-spin linear infinite;
        }
        .st-hand--minute { animation-duration: 6s; }
        .st-hand--hour   { animation-duration: 18s; }

        @keyframes st-bar-grow {
            0%   { transform: scaleY(.35); }
            50%  { transform: scaleY(1); }
            100% { transform: scaleY(.35); }
        }

        @keyframes st-trend-march {
            to { stroke-dashoffset: -11; }
        }

        @keyframes st-clock-spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .st-bar, .st-trend, .st-hand { animation: none; }
        }
    </style>

    <!-- Card frame -->
    <rect x="8" y="8" width="224" height="144" rx="14" fill="#FAF8F2" stroke="#1E40AF" stroke-width="2"/>

    <!-- Axes -->
    <line x1="40" y1="36" x2="40" y2="124" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="124" x2="208" y2="124" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>

    <!-- Muted bars hinting at future data -->
    <rect class="st-bar st-bar--1" x="58"  y="92"  width="20" height="32" rx="4" fill="#1E40AF" fill-opacity="0.12"/>
    <rect class="st-bar st-bar--2" x="90"  y="72"  width="20" height="52" rx="4" fill="#1E40AF" fill-opacity="0.18"/>
    <rect class="st-bar st-bar--3" x="122" y="82"  width="20" height="42" rx="4" fill="#1E40AF" fill-opacity="0.12"/>
    <rect class="st-bar st-bar--4" x="154" y="60"  width="20" height="64" rx="4" fill="#1E40AF" fill-opacity="0.18"/>
    <rect class="st-bar st-bar--5" x="186" y="78"  width="20" height="46" rx="4" fill="#1E40AF" fill-opacity="0.12"/>

    <!-- Dashed trend line -->
    <polyline class="st-trend" points="48,96 80,84 112,88 144,66 176,74 200,58"
              stroke="#FBBF24" stroke-opacity="0.55" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/>

    <!-- "Coming soon" clock badge -->
    <circle cx="120" cy="80" r="22" fill="#FAF8F2" stroke="#1E3A8A" stroke-opacity="0.45" stroke-width="2.5"/>
    <line class="st-hand st-hand--minute" x1="120" y1="80" x2="120" y2="68" stroke="#1E40AF" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round"/>
    <line class="st-hand st-hand--hour" x1="120" y1="80" x2="129" y2="84" stroke="#1E40AF" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round"/>
</svg>
