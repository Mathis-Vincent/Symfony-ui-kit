<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" fill="none">
    <title>Table coming soon</title>
    <style>
        /* Animations play when the SVG is referenced from an &lt;img&gt; tag */
        .st-cell {
            fill-opacity: .10;
            animation: st-cell-pulse 2.2s ease-in-out infinite;
        }
        .st-row--1 .st-cell { animation-delay: 0s; }
        .st-row--2 .st-cell { animation-delay: .2s; }
        .st-row--3 .st-cell { animation-delay: .4s; }
        .st-row--4 .st-cell { animation-delay: .6s; }

        .st-scan {
            transform-box: view-box;
            transform-origin: center;
            opacity: 0;
            animation: st-scan-sweep 2.6s ease-in-out infinite;
        }

        .st-hand {
            transform-box: view-box;
            transform-origin: 120px 80px;
            animation: st-clock-spin linear infinite;
        }
        .st-hand--minute { animation-duration: 6s; }
        .st-hand--hour   { animation-duration: 18s; }

        @keyframes st-cell-pulse {
            0%   { fill-opacity: .10; }
            50%  { fill-opacity: .28; }
            100% { fill-opacity: .10; }
        }

        @keyframes st-scan-sweep {
            0%   { transform: translateY(0); opacity: 0; }
            15%  { opacity: 1; }
            85%  { opacity: 1; }
            100% { transform: translateY(66px); opacity: 0; }
        }

        @keyframes st-clock-spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .st-cell, .st-scan, .st-hand { animation: none; }
        }
    </style>

    <!-- Card frame -->
    <rect x="8" y="8" width="224" height="144" rx="14" fill="#FAF8F2" stroke="#1E40AF" stroke-width="2"/>

    <!-- Table header -->
    <rect x="28" y="30" width="184" height="20" rx="5" fill="#1E40AF" fill-opacity="0.18"/>
    <rect x="36" y="37" width="34" height="6" rx="3" fill="#1E40AF" fill-opacity="0.5"/>
    <rect x="92" y="37" width="34" height="6" rx="3" fill="#1E40AF" fill-opacity="0.5"/>
    <rect x="148" y="37" width="34" height="6" rx="3" fill="#1E40AF" fill-opacity="0.5"/>

    <!-- Rows -->
    <g class="st-row--1">
        <rect class="st-cell" x="36"  y="60" width="42" height="8" rx="4" fill="#1E40AF"/>
        <rect class="st-cell" x="92"  y="60" width="42" height="8" rx="4" fill="#1E40AF"/>
        <rect class="st-cell" x="148" y="60" width="42" height="8" rx="4" fill="#1E40AF"/>
    </g>
    <g class="st-row--2">
        <rect class="st-cell" x="36"  y="78" width="42" height="8" rx="4" fill="#1E40AF"/>
        <rect class="st-cell" x="92"  y="78" width="42" height="8" rx="4" fill="#1E40AF"/>
        <rect class="st-cell" x="148" y="78" width="42" height="8" rx="4" fill="#1E40AF"/>
    </g>
    <g class="st-row--3">
        <rect class="st-cell" x="36"  y="96" width="42" height="8" rx="4" fill="#1E40AF"/>
        <rect class="st-cell" x="92"  y="96" width="42" height="8" rx="4" fill="#1E40AF"/>
        <rect class="st-cell" x="148" y="96" width="42" height="8" rx="4" fill="#1E40AF"/>
    </g>
    <g class="st-row--4">
        <rect class="st-cell" x="36"  y="114" width="42" height="8" rx="4" fill="#1E40AF"/>
        <rect class="st-cell" x="92"  y="114" width="42" height="8" rx="4" fill="#1E40AF"/>
        <rect class="st-cell" x="148" y="114" width="42" height="8" rx="4" fill="#1E40AF"/>
    </g>

    <!-- Scanning line hinting at loading data -->
    <line class="st-scan" x1="30" y1="58" x2="210" y2="58"
          stroke="#FBBF24" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round"/>

    <!-- "Coming soon" clock badge -->
    <circle cx="120" cy="80" r="22" fill="#FAF8F2" stroke="#1E3A8A" stroke-opacity="0.45" stroke-width="2.5"/>
    <line class="st-hand st-hand--minute" x1="120" y1="80" x2="120" y2="68" stroke="#1E40AF" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round"/>
    <line class="st-hand st-hand--hour" x1="120" y1="80" x2="129" y2="84" stroke="#1E40AF" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round"/>
</svg>
